    <!-- The event's own shorthand mark, and the ONLY icon declared. An earlier
         version left the previous mark as an `alternate icon` fallback, which
         Chrome then preferred — it ranks SVG above PNG regardless of order, so
         the tab kept showing the old logo. One icon, no ranking to lose. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo/mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
