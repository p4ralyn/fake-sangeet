<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#c8102e" />
    <title>Fake Sangeet</title>
    <!-- The event's own shorthand mark, and the ONLY icon declared. An earlier
         version left the previous mark as an `alternate icon` fallback, which
         Chrome then preferred — it ranks SVG above PNG regardless of order, so
         the tab kept showing the old logo. One icon, no ranking to lose. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS: Safari ignores an SVG here and falls back to a blank tile, which
         is why "Add to Home Screen" showed no logo on iPhones while Android
         (which reads the SVG icon above) was fine. It needs a PNG, opaque --
         iOS fills transparency black -- at 180x180; it rounds the corners
         itself. Rendered from logo/mark.svg on the paper colour. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Shrikhand&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
