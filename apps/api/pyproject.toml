[project]
name = "unigate-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "structlog>=24.4",
    "uuid-utils>=0.10",
    # LLD-v1 §10.1 wants the QR payload CBOR-encoded, not JSON: fewer bytes ->
    # lower QR density -> a scan that still works in bad light at a dark door.
    "cbor2>=5.6",
    "aiosmtplib>=3.0",
    "google-cloud-storage>=2.19",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# session-scoped so the session-scoped db_engine fixture's asyncpg pool stays
# bound to one loop across the whole test run; otherwise later tests hit
# "attached to a different loop" against connections opened by test 1.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
# S608 = hardcoded SQL expression. CLAUDE.md: never f-string SQL.
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. as argument defaults is the idiomatic,
# required pattern -- not the mutable-default footgun B008 exists to catch.
# `require_role` is a dependency *factory* (Depends(require_role(Role.OWNER))) --
# same idiom, evaluated once at route-declaration time, same as Depends itself.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Security",
    "app.core.deps.require_role",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["E501"]
