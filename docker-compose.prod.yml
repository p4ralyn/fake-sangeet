# Production overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from local dev:
#   - Caddy terminates TLS and is the only thing exposed publicly.
#   - Postgres and Redis stop publishing ports to the host; they are reachable
#     only inside the compose network. The firewall also blocks 5432, but
#     defence in depth: a misconfigured firewall should not expose the database.
#   - The SPA is built and served by `vite preview`, not the dev server. A dev
#     server on a public IP ships source maps and an HMR socket.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST, e.g. fakesangeet.live}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

  api:
    restart: unless-stopped
    ports: []            # reachable only through Caddy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  mailer:
    # The one service that must come back by itself: nobody is watching a
    # queue drain at 18:00, and a worker that died quietly at 17:40 looks
    # exactly like an empty queue on the Mail panel.
    restart: unless-stopped

  web:
    restart: unless-stopped
    ports: []
    environment:
      # vite preview refuses an unrecognised Host with a bare 403. Caddy
      # forwards the real one, so the deployed hostname must be declared --
      # same variable Caddy uses, so the two cannot drift apart.
      SITE_HOST: ${SITE_HOST:?set SITE_HOST}
      API_PROXY_TARGET: http://api:8000
    command: sh -c "npm install --no-audit --no-fund && npm run build && npx vite preview --host 0.0.0.0 --port 5173 --strictPort"

  postgres:
    restart: unless-stopped
    ports: []            # never expose the database to the host

  redis:
    restart: unless-stopped
    ports: []

  mailpit:
    restart: unless-stopped

  fake-gcs:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
