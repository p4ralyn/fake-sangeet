name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cp .env.example .env

      - name: Build the api image
        run: docker compose build api

      - name: Start object storage and mail catcher
        run: |
          docker compose up -d fake-gcs mailpit
          for i in $(seq 30); do
            curl -sf http://localhost:4443/storage/v1/b >/dev/null && exit 0
            sleep 1
          done
          echo "fake-gcs did not come up" && exit 1

      - name: Lint
        run: docker compose run --rm api ruff check .

      - name: Test
        run: docker compose run --rm api pytest tests/ -q

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
