name: unigate

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unigate
      POSTGRES_PASSWORD: unigate
      POSTGRES_DB: unigate
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unigate"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local stand-in for Workspace SMTP. Web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  # Local stand-in for GCS. Same JSON API, no credentials.
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    # The volume is mounted where objects are WRITTEN (-filesystem-root), not
    # at /data, which the server only reads once at start-up to preload. With
    # it at /data, every uploaded ID photo lived in the container's own layer
    # and vanished on each recreate -- i.e. on every deploy (found 5 Oct 2026,
    # when a demo's photo was gone two deploys after it was uploaded).
    command:
      - "-scheme"
      - "http"
      - "-port"
      - "4443"
      - "-public-host"
      - "localhost:4443"
      - "-backend"
      - "filesystem"
      - "-filesystem-root"
      - "/storage"
    ports: ["4443:4443"]
    volumes:
      - gcsdata:/storage

  api:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://unigate:unigate@postgres:5432/unigate
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /srv/app
    ports: ["8000:8000"]
    volumes:
      - ./apps/api:/srv/app
      - ./scripts:/srv/scripts
      # Read-only, and only so one test can compare the frontend's ErrorCode
      # union against the server's enum. That agreement spans two languages, so
      # no type checker sees it, and it had drifted in both directions at once.
      # A contract test that can never see one side would skip forever and
      # prove nothing.
      - ./apps/web/src:/srv/web-src:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # The outbox worker. Same image and same environment as `api` — it imports
  # the same services and must see the same database — but it serves no HTTP
  # and publishes no port.
  #
  # It exists because the queue had nothing draining it: rows went into
  # `email_outbox` at ingest and sat there until somebody remembered to run
  # the script by hand. CLAUDE.md rules out Cloud Tasks and a second cloud
  # service, so the choice was a loop in a container or a cron entry; this is
  # the loop, and it is one `docker compose` away from being off.
  mailer:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://unigate:unigate@postgres:5432/unigate
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /srv/app
    volumes:
      - ./apps/api:/srv/app
      - ./scripts:/srv/scripts
    command: ["python", "/srv/scripts/mailer.py", "--watch"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    image: node:20-alpine
    working_dir: /srv/web
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ./apps/web:/srv/web
      - web_node_modules:/srv/web/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  gcsdata:
  web_node_modules:
